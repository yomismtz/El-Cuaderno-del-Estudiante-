name: Add student task completion

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-task-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add local task completion support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/cuadernoestudiante/app/data/repository/StudentRepository.kt')
          s = p.read_text().replace('    fun resetDemoData()\n', '    fun resetDemoData()\n\n    fun markAssessmentCompleted(localId: String, completed: Boolean)\n')
          p.write_text(s)

          p = Path('app/src/main/java/com/cuadernoestudiante/app/data/demo/DemoStudentRepository.kt')
          s = p.read_text()
          if 'AssessmentStatus' not in s:
              s = s.replace('import com.cuadernoestudiante.app.core.model.StudentDataSnapshot\n', 'import com.cuadernoestudiante.app.core.model.StudentDataSnapshot\nimport com.cuadernoestudiante.app.core.model.AssessmentStatus\n')
          s = s.replace('''    override fun resetDemoData() {
        _snapshot.value = DemoDataFactory.create()
    }
}''', '''    override fun resetDemoData() {
        _snapshot.value = DemoDataFactory.create()
    }

    override fun markAssessmentCompleted(localId: String, completed: Boolean) {
        val current = _snapshot.value
        _snapshot.value = current.copy(
            assessments = current.assessments.map { assessment ->
                if (assessment.meta.localId == localId && assessment.status != AssessmentStatus.GRADED) {
                    assessment.copy(status = if (completed) AssessmentStatus.SUBMITTED else AssessmentStatus.PENDING)
                } else assessment
            }
        )
    }
}''')
          p.write_text(s)

          p = Path('app/src/main/java/com/cuadernoestudiante/app/StudentViewModel.kt')
          s = p.read_text().replace('    fun resetDemoData() = repository.resetDemoData()\n', '    fun resetDemoData() = repository.resetDemoData()\n\n    fun markAssessmentCompleted(localId: String, completed: Boolean) = repository.markAssessmentCompleted(localId, completed)\n')
          p.write_text(s)

          p = Path('app/src/main/java/com/cuadernoestudiante/app/StudentApp.kt')
          s = p.read_text().replace('                    onResetDemo = viewModel::resetDemoData,', '                    onResetDemo = viewModel::resetDemoData,\n                    onToggleTask = viewModel::markAssessmentCompleted,')
          p.write_text(s)

          p = Path('app/src/main/java/com/cuadernoestudiante/app/ui/screens/home/HomeScreen.kt')
          s = p.read_text()
          s = s.replace('    onResetDemo: () -> Unit,\n    modifier: Modifier = Modifier,', '    onResetDemo: () -> Unit,\n    onToggleTask: (String, Boolean) -> Unit,\n    modifier: Modifier = Modifier,')
          s = s.replace('PendingRow(assessment = assessment, subjects = snapshot.subjects)', 'PendingRow(assessment = assessment, subjects = snapshot.subjects, onToggleTask = onToggleTask)')
          s = s.replace('''private fun PendingRow(
    assessment: Assessment,
    subjects: List<Subject>,
) {''', '''private fun PendingRow(
    assessment: Assessment,
    subjects: List<Subject>,
    onToggleTask: (String, Boolean) -> Unit,
) {''')
          needle = '''            Text(
                shortDueDate(assessment.dueAt),
                style = MaterialTheme.typography.labelMedium,
                color = MaterialTheme.colorScheme.primary,
            )'''
          replacement = '''            Column(horizontalAlignment = Alignment.End) {
                Text(
                    shortDueDate(assessment.dueAt),
                    style = MaterialTheme.typography.labelMedium,
                    color = MaterialTheme.colorScheme.primary,
                )
                if (assessment.status != AssessmentStatus.GRADED) {
                    Checkbox(
                        checked = assessment.status == AssessmentStatus.SUBMITTED,
                        onCheckedChange = { onToggleTask(assessment.meta.localId, it) }
                    )
                    Text(
                        if (assessment.status == AssessmentStatus.SUBMITTED) "Hecha" else "Marcar hecha",
                        style = MaterialTheme.typography.labelSmall
                    )
                }
            }'''
          if needle not in s:
              raise SystemExit('PendingRow date block not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Commit student task completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/cuadernoestudiante/app
          git diff --cached --quiet || git commit -m "Allow students to mark their own tasks complete"
          git push
