name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK and AAB
        run: gradle assembleDebug bundleDebug
      - name: Upload debug APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ElCuadernoDelEstudiante-debug-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
      - name: Prepare public APK
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk El-Cuaderno-del-Estudiante.apk
      - name: Publish rolling Android download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin -f android-latest
          NOTES="APK Android de prueba generado automáticamente desde main. Commit: $GITHUB_SHA"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest El-Cuaderno-del-Estudiante.apk --clobber
            gh release edit android-latest --title "El Cuaderno del Estudiante · descarga Android" --notes "$NOTES" --prerelease
          else
            gh release create android-latest El-Cuaderno-del-Estudiante.apk --target "$GITHUB_SHA" --title "El Cuaderno del Estudiante · descarga Android" --notes "$NOTES" --prerelease
          fi
